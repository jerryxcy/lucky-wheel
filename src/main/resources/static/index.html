<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Wheel 抽籤轉盤</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="stage">
        <header id="top-bar">
            <h1>LUCKY WHEEL</h1>
            <button type="button" id="drawer-toggle" aria-expanded="false" aria-controls="roster-drawer">⚙ 名單</button>
        </header>

        <div id="wheel-area">
            <p id="pick-banner" aria-live="polite"></p>
            <div id="wheel-box">
                <div id="wheel-pointer"></div>
                <canvas id="wheel-canvas" width="480" height="480"></canvas>
            </div>
        </div>

        <div id="bottom-bar">
            <div id="spin-controls">
                <label for="count-select">抽出人數</label>
                <select id="count-select"></select>
                <button type="button" id="order-everyone-button" class="ghost-button">全員排序</button>
            </div>
            <button type="button" id="spin-button" class="spin-button">SPIN</button>
            <button type="button" id="skip-button" class="ghost-button" hidden>跳過</button>
        </div>
        <p id="spin-disabled-reason" class="notice" hidden></p>
        <p id="spin-error" class="notice" role="alert" hidden></p>
    </div>

    <div id="drawer-backdrop" hidden></div>
    <aside id="roster-drawer" aria-labelledby="roster-heading">
        <div id="drawer-head">
            <h2 id="roster-heading">名單 Roster</h2>
            <button type="button" id="drawer-close" aria-label="關閉名單">關閉</button>
        </div>

        <form id="add-member-form">
            <label for="member-name-input" class="visually-hidden">成員姓名</label>
            <input
                type="text"
                id="member-name-input"
                name="memberName"
                placeholder="輸入姓名後按 Enter 或「新增」"
                autocomplete="off"
            >
            <button type="submit">新增</button>
        </form>
        <p id="add-member-notice" class="notice" role="alert" hidden></p>

        <ul id="member-list"></ul>
        <p id="empty-roster-notice" class="notice" hidden>名單目前是空的，請先新增成員。</p>
    </aside>

    <div id="result-overlay" hidden>
        <h2>抽籤結果 Draw order</h2>
        <ol id="draw-order-list"></ol>
        <button type="button" id="close-overlay-button">關閉</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
